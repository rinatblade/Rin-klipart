plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.rin.klipart'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.rin.klipart'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    androidResources {
        noCompress 'onnx'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
